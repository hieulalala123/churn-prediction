global:
  scrape_interval: 15s

scrape_configs:
  - job_name: churn-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: pushgateway
    # honor_labels: keep the "job" label the push client sets (drift_check)
    # instead of Prometheus overwriting it with "pushgateway".
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
