apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # Pinned uid: Grafana auto-generates a random one otherwise, which the
    # dashboard JSON can't reference deterministically across a fresh
    # `docker compose up` (a different random uid each time would silently
    # break every panel's datasource pin).
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
